name: MCP OAuth consent

on:
  pull_request:
  push:
    branches: [main]

jobs:
  consent:
    # ubuntu-latest moved to 26.04, which Playwright's Chromium install does not support yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint app/oauth app/layout.tsx components/OAuth components/Analytics lib/oauth providers/Providers.tsx components/Context/ContextPageLayout.tsx next.config.mjs
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit --project tsconfig.oauth.json
      - run: pnpm test -- lib/oauth components/OAuth
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm exec vitest run --config vitest.oauth.browser.config.ts
