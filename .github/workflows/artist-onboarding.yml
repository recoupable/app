name: Artist onboarding browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  onboarding-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium --only-shell
      - run: pnpm exec vitest run --config vitest.onboarding.config.ts
